name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Install BPF toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang llvm libbpf-dev
      - name: Generate eBPF bindings (Linux)
        if: runner.os == 'Linux'
        run: make bpf-generate
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --clean
      - name: Locate built binary
        id: bin
        run: echo "path=$(jq -r '.[] | select(.type=="Binary") | .path' dist/artifacts.json)" >> "$GITHUB_OUTPUT"
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - "${{ steps.bin.outputs.path }}"
      - name: Rename binary
        run: |
          mkdir -p out
          cp "${{ steps.bin.outputs.path }}" out/trafficmon-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: trafficmon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/trafficmon-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum trafficmon-* > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/trafficmon-*
            dist/checksums.txt
