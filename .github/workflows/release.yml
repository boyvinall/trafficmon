name: Release

on:
  release:
    types: [created]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "::error::This workflow only runs against a tag (got ref '${{ github.ref }}'). Re-run it from a tag." >&2
          exit 1
      - name: Require a pre-existing release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --clean
      - name: Locate built binary
        id: bin
        shell: bash
        run: echo "path=$(jq -r '.[] | select(.type=="Binary") | .path' dist/artifacts.json)" >> "$GITHUB_OUTPUT"
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - "${{ steps.bin.outputs.path }}"
      - name: Package binary
        shell: bash
        run: |
          mkdir -p out
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          bin="trafficmon$ext"
          cp "${{ steps.bin.outputs.path }}" "$bin"
          7z a -tzip "out/trafficmon-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: trafficmon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/trafficmon-${{ matrix.goos }}-${{ matrix.goarch }}.zip
          if-no-files-found: error

  # Built inside Alpine (musl) rather than the ubuntu-latest/-arm runners
  # directly: a static, netgo-tagged binary compiled here carries no glibc
  # symbol-versioning floor and no libpcap.so runtime dependency, so it runs
  # unmodified on any Linux distro/kernel new enough for the syscalls it
  # uses -- not just whatever glibc happened to be on the build host.
  build-linux:
    needs: verify
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
          - os: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.os }}
    container: golang:1.22-alpine
    steps:
      - name: Install build dependencies
        run: apk add --no-cache gcc musl-dev libpcap-dev clang llvm libbpf-dev git bash jq p7zip
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Generate eBPF bindings
        run: make bpf-generate
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: build --single-target --clean --id trafficmon-linux
      - name: Locate built binary
        id: bin
        shell: bash
        run: echo "path=$(jq -r '.[] | select(.type=="Binary") | .path' dist/artifacts.json)" >> "$GITHUB_OUTPUT"
      - name: Package binary
        shell: bash
        run: |
          mkdir -p out
          cp "${{ steps.bin.outputs.path }}" trafficmon
          7z a -tzip "out/trafficmon-linux-${{ matrix.goarch }}.zip" trafficmon
      - uses: actions/upload-artifact@v4
        with:
          name: trafficmon-linux-${{ matrix.goarch }}
          path: out/trafficmon-linux-${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish:
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum trafficmon-*.zip > checksums.txt
      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/trafficmon-*.zip dist/checksums.txt --clobber --repo "${{ github.repository }}"
