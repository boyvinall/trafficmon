name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macos only: cgo bindings to libproc and libpcap are darwin-specific.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's directive (1.22.0) predates cmd/link emitting LC_UUID, which macOS 26's dyld requires.
          go-version: stable
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
