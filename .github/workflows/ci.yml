name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macos only: cgo bindings to libproc and libpcap are darwin-specific.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
