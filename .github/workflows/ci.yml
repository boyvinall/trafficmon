name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod's directive (1.22.0) predates cmd/link emitting LC_UUID, which macOS 26's dyld requires.
          go-version: stable
      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev
      - name: Install BPF toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang llvm libbpf-dev
      # procinfo/bpf/headers/vmlinux.h is committed (a BTF header dump, not a
      # build artifact), so this only compiles C against it -- no live kernel
      # BTF access needed, just clang/llvm/libbpf-dev.
      - name: Generate eBPF bindings (Linux)
        if: runner.os == 'Linux'
        run: make bpf-generate
      - name: Generate otel-collector distribution
        run: make generate-otel-collector
      - run: make build
      - run: make build-otel-collector
      - run: make test
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: cmd/trafficmon
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: receiver
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: cmd/otel-collector

  build-windows:
    # Windows pcap/procinfo backends are cgo-free, so this leg needs no
    # libpcap-dev-equivalent install step; `make`/`sudo` aren't available by
    # default on windows-latest runners, so it drives go/golangci-lint
    # directly instead of through the Makefile.
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Generate otel-collector distribution
        working-directory: cmd/otel-collector
        run: |
          go run go.opentelemetry.io/collector/cmd/builder@v0.119.0 --config builder-config.yaml --skip-compilation
          go mod tidy
      - run: go build ./...
      - run: go build ./...
        working-directory: cmd/trafficmon
      - run: go build ./...
        working-directory: receiver
      - run: go build ./...
        working-directory: cmd/otel-collector
      - run: go test ./...
      - run: go test ./...
        working-directory: cmd/trafficmon
      - run: go test ./...
        working-directory: receiver
      - run: go test ./...
        working-directory: cmd/otel-collector
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: cmd/trafficmon
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: receiver
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: cmd/otel-collector
