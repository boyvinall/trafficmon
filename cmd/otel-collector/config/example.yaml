# Minimal example: just the trafficmon receiver, with debug printing every
# log record it produces (DNS queries, SYN attempts) and prometheus exposing
# every metric it produces (trafficmon.network.io, trafficmon.dns.query.count,
# trafficmon.network.syn.count) for scraping. Run via ../config/run.sh.
receivers:
  trafficmon:
    collection_interval: 1s
    max_peer_cardinality: 1000

processors:
  batch:

exporters:
  debug:
    verbosity: detailed

  prometheus:
    endpoint: 0.0.0.0:9464

service:
  pipelines:
    metrics:
      receivers: [trafficmon]
      processors: [batch]
      exporters: [prometheus]

    logs:
      receivers: [trafficmon]
      processors: [batch]
      exporters: [debug]
